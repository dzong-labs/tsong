name: DCO

# Every commit in a pull request must be signed off by its author under
# the Developer Certificate of Origin, as CONTRIBUTING.md requires. It runs
# on every pull request, whatever it changes, except Dependabot's: a bot
# can't certify the DCO, and GitHub sets the pull request's author, so no
# one else can claim to be Dependabot. Commit authors are free text, so the
# check never trusts them for this.
on:
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  dco:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Every commit is signed off by its author
      env:
        BASE: ${{ github.base_ref }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: scripts/dco.sh "origin/$BASE..$HEAD"
