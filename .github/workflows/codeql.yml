name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "27 6 * * 1"

# Read-only unless a job asks for more.
permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is analyzed only when its files change, and always on the
        # weekly schedule, since runner minutes are limited. The workflows
        # are analyzed on every commit: it takes seconds, and gives each
        # commit a CodeQL result, which Scorecard's SAST check looks for.
        # The job itself always runs, so the required Analyze checks still
        # report.
        include:
          - language: actions
            build-mode: none
            paths: '.'
          - language: rust
            build-mode: none
            paths: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: ${{ matrix.paths }}
      - name: Initialize CodeQL
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
