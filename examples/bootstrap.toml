# A sample bootstrap file, deployed with Tsong: `tsong serve bootstrap.toml`.
# It says where the config lives, which the config itself can't say.
#
# Durations are [d.]hh:mm:ss[.fffffff], as .NET writes a TimeSpan:
# "00:15:00" is 15 minutes, "1.01:00:00" is 25 hours.

# Config source
# A file on disk, relative to this file. It is read once, at start.
[source]
store = "file"
path = "tsong.toml"

# Admin listener
# GET /status and GET /metrics. Only clients in the served config's
# gateway.allow get in.
[admin]
listen = "0.0.0.0:8445"

# Health listener
# GET /health/live and GET /health/ready, for the load balancer. Its allow
# list is deployed here and checked against each connection's own address;
# no X-Forwarded-For is read.
[health]
listen = "0.0.0.0:8447"
allow = ["10.20.0.0/16"]                  # the load balancer's subnets
drain = "00:00:05"                        # on shutdown, readiness fails this long before the listeners close;
                                          # see docs/notes/shutdown-and-draining.md

# Audit writer
# Audit lines go to stdout from a thread of their own. Optional; these are
# the defaults. See docs/notes/observability.md.
[audit]
queue = 65536                             # lines held before new ones are dropped, 1 to 1048576
shutdown = "00:00:05"                     # how long a stop waits for the writer, up to 00:01:00
